[project]
name = "job-hunter"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "siddheshwarkhandare", email = "235892541+siddheshwarkhandare@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "fastapi[standard]>=0.141.1",
    "google-genai>=2.23.0",
    "groq>=1.7.0",
    "jinja2>=3.1.6",
    "openai>=3.11.0",
    "pydantic>=2.13.5",
    "pymupdf>=1.28.2",
    "requests>=2.34.2",
    "unicron>=0.0.1",
    "uvicorn>=0.52.4",
]

[project.scripts]
job-hunter = "job_hunter:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
